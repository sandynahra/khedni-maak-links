<html lang="en">
<head>

<meta name="robots" content="noindex">
<title>Khedni Maak! has moved</title>
<link rel="canonical" href="https://khednimaak.github.io/">
<script>
  // Old address of the Khedni Maak! shared links: forward to the new one, keeping the page
  // (e.g. /u/) and the ?id=… so old shared links keep working.

    var path = location.pathname.replace(/^\/khedni-maak-links/, '') || '/';
    location.replace('https://khednimaak.github.io' + path + location.search + location.hash);
  })();
</script>
</head>
